<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Maker</title>
  <!--
    PLACEHOLDER — the avatar workstream replaces this.
    The photo is opened locally with an object URL. It is never uploaded, stored or committed.
    Output: one AvatarSpec JSON (src/contracts/avatar.schema.json) → data/avatars/<id>.json.
  -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #0b1026; color: #f4f7ff; }
    main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    img, canvas { width: 100%; aspect-ratio: 1; object-fit: cover; background: #1c2446; border-radius: 8px; }
    textarea { width: 100%; min-height: 360px; font: 12px ui-monospace, monospace; background: #111831; color: inherit; }
    button { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Avatar Maker</h1>
  <main>
    <section>
      <label>Donor photo (stays on this computer) <input type="file" id="photo" accept="image/*"></label>
      <img id="preview" alt="">
    </section>
    <section>
      <textarea id="spec" spellcheck="false"></textarea>
      <button id="download">Download JSON</button>
      <p id="error" role="alert"></p>
    </section>
    <section><canvas id="mii"></canvas></section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { buildMii } from "../../src/crowd/mii.js";

    const template = await (await fetch("../../data/avatars/sample-ada.json")).json();
    Object.assign(template, { id: "firstname-l", displayName: "", consent: { public: true, givenOn: new Date().toISOString().slice(0, 10) } });
    const specEl = document.getElementById("spec");
    specEl.value = JSON.stringify(template, null, 2);

    document.getElementById("photo").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) document.getElementById("preview").src = URL.createObjectURL(file);
    });

    const canvas = document.getElementById("mii");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x333355, 2.5));
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
    camera.position.set(0, 0.8, 3);
    camera.lookAt(0, 0.6, 0);
    let mii;

    function rebuild() {
      try {
        const spec = JSON.parse(specEl.value);
        if (mii) scene.remove(mii);
        mii = buildMii(spec);
        scene.add(mii);
        document.getElementById("error").textContent = "";
      } catch (err) {
        document.getElementById("error").textContent = err.message;
      }
    }
    specEl.addEventListener("input", rebuild);
    rebuild();

    renderer.setAnimationLoop((t) => {
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      if (mii) mii.rotation.y = Math.sin(t / 1000) * 0.6;
      renderer.render(scene, camera);
    });

    document.getElementById("download").addEventListener("click", () => {
      const spec = JSON.parse(specEl.value);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(spec, null, 2) + "\n"], { type: "application/json" }));
      a.download = `${spec.id}.json`;
      a.click();
    });
  </script>
</body>
</html>
